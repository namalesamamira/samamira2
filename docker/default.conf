# Main/Default Site - catches all requests not matching other server blocks
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;
    root /var/www/project;
    index index.html index.php;

    # Main site location blocks
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP processing for main site
    location ~ \.php$ {
        fastcgi_pass php_container:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Security headers
    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name helloworld.samamira.com helloworld.localhost;
    root /var/www/project/helloworld;
    index index.html index.php;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    # For PHP files
    location ~ \.php$ {
        fastcgi_pass php_container:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # CORS headers for API
    location ~* \.(json)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
    }

    # Static assets with caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security
    location ~ /\.ht {
        deny all;
    }
}

